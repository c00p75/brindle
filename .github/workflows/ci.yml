name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: backend

      - name: Run tests
        run: python -m pytest -q --tb=short
        working-directory: backend

      - name: Verify Alembic migrations apply cleanly
        run: |
          DATABASE_URL=sqlite:///./data/ci-test.db alembic upgrade head
          DATABASE_URL=sqlite:///./data/ci-test.db alembic downgrade -1
          DATABASE_URL=sqlite:///./data/ci-test.db alembic upgrade head
        working-directory: backend

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend
